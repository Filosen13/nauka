<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TechNauka</title>
<meta name="theme-color" content="#c7410b">
<meta name="description" content="Nauka PLC, elektryki, pneumatyki, hydrauliki i angielskiego technicznego.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
/* Układ: jedna kolumna (telefon), lepki nagłówek, dolny pasek zakładek pod kciukiem. Papier schematowy w tle. */
:root {
  --bg: #eef1f3; --surface: #ffffff; --surface-2: #f5f7f8; --ink: #16202b; --muted: #5a6876; --line: #d3dae0;
  --accent: #c7410b; --accent-ink: #ffffff; --accent-soft: #fde7da;
  --ok: #19774d; --ok-soft: #dcf1e5; --bad: #bf2a2a; --bad-soft: #fae2e2;
  --grid: rgba(22, 32, 43, .045); --shadow: 0 1px 2px rgba(22, 32, 43, .06), 0 4px 14px rgba(22, 32, 43, .05);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #172029; --surface-2: #1c2731; --ink: #e4eaef; --muted: #93a3b1; --line: #2a3744;
    --accent: #ff7a3a; --accent-ink: #1b0c04; --accent-soft: #3a2316;
    --ok: #4cc58b; --ok-soft: #133022; --bad: #ff6b6b; --bad-soft: #3a1818;
    --grid: rgba(228, 234, 239, .04); --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #172029; --surface-2: #1c2731; --ink: #e4eaef; --muted: #93a3b1; --line: #2a3744;
  --accent: #ff7a3a; --accent-ink: #1b0c04; --accent-soft: #3a2316;
  --ok: #4cc58b; --ok-soft: #133022; --bad: #ff6b6b; --bad-soft: #3a1818;
  --grid: rgba(228, 234, 239, .04); --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 620px; margin: 0 auto; }

/* Nagłówek */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 22px/1 var(--f-display); letter-spacing: .02em; text-decoration: none; color: var(--ink); }
.brand svg { width: 28px; height: 28px; }
.streak { display: inline-flex; align-items: center; gap: 6px; font: 600 14px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.streak b { color: var(--accent); font-size: 18px; }

main { padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: 34px; font-weight: 700; letter-spacing: .005em; }
h2 { font-size: 24px; font-weight: 700; }
h3 { font-size: 19px; font-weight: 600; }
.lede { color: var(--muted); margin: 6px 0 0; }
.eyebrow { font: 600 12px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* Panele */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.today { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.today .big { font: 700 44px/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 360px) { .tiles { grid-template-columns: 1fr; } }
.tile { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; transition: border-color .15s, transform .15s; }
.tile:hover { border-color: var(--accent); }
.tile:active { transform: scale(.985); }
.tile .ico { width: 34px; height: 34px; color: var(--accent); }
.tile h3 { font-size: 20px; }
.tile p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.35; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.stat { font: 600 14px/1 var(--f-display); letter-spacing: .03em; font-variant-numeric: tabular-nums; }

/* Przyciski */
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 11px 16px; font: 600 16px/1.2 var(--f-display); letter-spacing: .03em; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.05); }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.linkbtn { appearance: none; background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; }

/* Chipy filtrów */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 13px; font: 600 15px/1 var(--f-display); letter-spacing: .03em; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { opacity: .7; font-variant-numeric: tabular-nums; margin-left: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { appearance: none; border: 0; background: none; padding: 8px 12px; font: 600 15px/1 var(--f-display); letter-spacing: .03em; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* Liczniki */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.kpi b { display: block; font: 700 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }

/* Fiszka */
.progress { display: flex; align-items: center; gap: 10px; }
.progress .meter { flex: 1; }
.flash { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; min-height: 260px; display: flex; flex-direction: column; justify-content: center; gap: 12px; box-shadow: var(--shadow); cursor: pointer; text-align: center; }
.flash .term { font: 700 34px/1.1 var(--f-display); overflow-wrap: anywhere; }
.flash .tr { font: 600 24px/1.2 var(--f-display); color: var(--accent); overflow-wrap: anywhere; }
.flash .ex { font-size: 16px; color: var(--muted); font-style: italic; }
.flash .tag { position: absolute; top: 12px; left: 14px; }
.flash .hint { font-size: 13px; color: var(--muted); }
.flash hr { border: 0; border-top: 1px dashed var(--line); width: 60%; margin: 2px auto; }
.say { appearance: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; width: 40px; height: 40px; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink); }
.say svg { width: 20px; height: 20px; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grade .btn { flex-direction: column; gap: 2px; min-height: 58px; }
.grade .btn small { font: 400 12px/1 var(--f-body); color: inherit; opacity: .75; letter-spacing: 0; }
.grade .again { border-color: var(--bad); color: var(--bad); }
.grade .hard { border-color: var(--muted); }
.grade .good { background: var(--ok); border-color: var(--ok); color: var(--surface); }

/* Lista słówek */
.wlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.witem { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.witem:first-child { border-top: 0; }
.witem .en { font-weight: 600; }
.witem .pl { color: var(--muted); font-size: 14px; grid-column: 1; }
.lvl { grid-row: 1 / span 2; align-self: center; display: flex; gap: 3px; }
.lvl i { width: 6px; height: 14px; border-radius: 2px; background: var(--line); }
.lvl i.on { background: var(--ok); }
.search { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; }

/* Quiz */
.qhead { display: flex; flex-direction: column; gap: 8px; }
.qprompt { font: 600 19px/1.35 var(--f-body); margin: 0; }
.qprompt b { color: var(--accent); }
.diagram { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; overflow-x: auto; }
.diagram svg { display: block; width: 100%; max-width: 440px; min-width: 280px; height: auto; margin: 0 auto; }
pre.code { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; overflow-x: auto; font: 500 14px/1.6 var(--f-mono); }
pre.code .blank { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 4px; font-weight: 700; }
code { font-family: var(--f-mono); font-size: .9em; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opts.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { appearance: none; text-align: left; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 14px; cursor: pointer; font: 500 16px/1.35 var(--f-body); display: flex; gap: 10px; align-items: center; min-height: 52px; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); display: grid; place-items: center; font: 700 14px/1 var(--f-display); color: var(--muted); }
.opt.sym { flex-direction: column; text-align: center; gap: 6px; padding: 10px 8px; justify-content: flex-start; }
.opt.sym .sy { width: 100%; max-width: 150px; height: 74px; }
.opt.sym .sy.v { height: 92px; }
.opt .tg { font: 600 13px/1.2 var(--f-mono); color: var(--muted); }
.opt .nm { font-size: 13px; line-height: 1.3; }
.opt.code { font-family: var(--f-mono); font-weight: 600; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .55; }
.explain { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); background: var(--surface); }
.explain .verdict { font: 700 20px/1.1 var(--f-display); }
.explain.ok .verdict { color: var(--ok); }
.explain.bad .verdict { color: var(--bad); }
.explain p { margin: 0; }
.explain b { font-weight: 700; }
.symbig { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; place-items: center; }
.symbig .sy { width: 100%; max-width: 280px; height: 150px; }
.symbig .sy.v { height: 180px; }
.en-term { font: 600 15px/1.3 var(--f-display); letter-spacing: .02em; color: var(--muted); }

/* Atlas */
.atlas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.acard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.acard .sy { width: 100%; height: 70px; }
.acard .sy.v { height: 84px; }
.acard h3 { font-size: 16px; }
.acard .en { font-size: 12px; color: var(--muted); font-style: italic; }
.acard p { margin: 0; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.acard .ok-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-left: 6px; vertical-align: middle; }

/* Podsumowanie */
.score { font: 700 64px/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.wronglist { margin: 0; padding-left: 18px; color: var(--muted); }

/* SVG schematów */
svg .ln { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg .ln.bgf { fill: var(--surface); }
svg .lnf { fill: var(--ink); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
svg .fl { fill: var(--ink); stroke: none; }
svg .dash { stroke-dasharray: 5 4; }
svg .thick { stroke-width: 3.5; }
svg .rail { stroke-width: 2.6; }
svg .tx { fill: var(--ink); stroke: none; font: 600 13px var(--f-display); letter-spacing: .02em; }
svg .tx.sm { font-size: 11.5px; }
svg .tx.big { font-size: 17px; font-weight: 700; }
svg .tx.mu { fill: var(--muted); }
svg .tx.code { font-family: var(--f-mono); font-size: 11px; font-weight: 600; }
svg .qb { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
svg .qt { fill: var(--accent); stroke: none; font: 800 24px var(--f-display); }

/* Dolny pasek */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 10px; text-decoration: none; color: var(--muted); font: 600 12px/1 var(--f-display); letter-spacing: .04em; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

.foot { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: middle; }
.sync-dot.on { background: var(--ok); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>

<header class="top"><div class="wrap">

<script>

/* ===== Rysowanie SVG: prymitywy, symbole, schematy ===== */
const f1 = n => +(+n).toFixed(1);
const P = (d, c = 'ln') => `<path class="${c}" d="${d}"/>`;
const Ci = (x, y, r, c = 'ln') => `<circle class="${c}" cx="${x}" cy="${y}" r="${r}"/>`;
const Re = (x, y, w, h, c = 'ln', rx = 0) => `<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}"${rx ? ` rx="${rx}"` : ''}/>`;
const Tx = (x, y, s, c = 'tx', a = 'middle') => `<text class="${c}" x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
function head(x, y, ang, s = 6) {
  const a1 = ang + 2.6, a2 = ang - 2.6;
  return P(`M${f1(x)} ${f1(y)}L${f1(x + s * Math.cos(a1))} ${f1(y + s * Math.sin(a1))}L${f1(x + s * Math.cos(a2))} ${f1(y + s * Math.sin(a2))}Z`, 'fl');
}
function Ar(x1, y1, x2, y2, s = 6) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const ex = x2 - Math.cos(a) * s * 0.6, ey = y2 - Math.sin(a) * s * 0.6;
  return P(`M${f1(x1)} ${f1(y1)}L${f1(ex)} ${f1(ey)}`) + head(x2, y2, a, s);
}
const W = pts => P('M' + pts.map(p => p.join(' ')).join('L'));
const dot = (x, y) => Ci(x, y, 3, 'fl');
function QB(cx, cy, w = 44, h = 44) {
  return Re(cx - w / 2, cy - h / 2, w, h, 'qb', 6) + `<text class="qt" x="${cx}" y="${cy + 8}" text-anchor="middle">?</text>`;
}
const svgW = (vb, inner, label = 'Schemat') => `<svg class="dg" viewBox="${vb}" role="img" aria-label="${label}">${inner}</svg>`;

/* ---- Elektryczne IEC 60617: lokalnie poziomo, zaciski (0,0) i (60,0) ---- */
const ES = {
  no: () => P('M0 0H20L41 -11M40 0H60'),
  nc: () => P('M0 0H20L46 10M40 0H60M40 0V11'),
  pbNO: () => ES.no() + P('M30.5 -5.5V-17', 'ln dash') + P('M24 -13V-17H37V-13'),
  pbNC: () => ES.nc() + P('M33 5V17', 'ln dash') + P('M26.5 13V17H39.5V13'),
  estop: () => ES.nc() + P('M33 5V16', 'ln dash') + P('M25 16H41A8 8 0 0 1 25 16Z', 'ln bgf'),
  coil: () => P('M0 0H22M38 0H60') + Re(22, -12, 16, 24, 'ln bgf'),
  fuse: () => P('M0 0H60') + Re(16, -6, 28, 12) ,
  cb: () => ES.no() + P('M36 -4L44 4M36 4L44 -4'),
  kmain: () => ES.no() + P('M44 0A4 4 0 0 0 36 0'),
  therm: () => P('M0 0H16M44 0H60') + Re(16, -10, 28, 20, 'ln bgf') + P('M21 4H26V-4H34V4H39'),
  olNC: () => ES.nc() + P('M33 5V14', 'ln dash') + P('M24.5 20H28.5V14H37.5V20H41.5'),
  lamp: () => P('M0 0H19M41 0H60') + Ci(30, 0, 11, 'ln bgf') + P('M22.2 -7.8L37.8 7.8M22.2 7.8L37.8 -7.8'),
  res: () => P('M0 0H18M42 0H60') + Re(18, -6, 24, 12, 'ln bgf'),
  cap: () => P('M0 0H27M33 0H60M27 -11V11M33 -11V11'),
  diode: () => P('M0 0H22M38 0H60') + P('M22 -9L22 9L38 0Z', 'lnf') + P('M38 -9V9'),
  led: () => ES.diode() + Ar(27, -12, 33, -21, 4) + Ar(34, -12, 40, -21, 4),
  ind: () => P('M0 0H15A5 5 0 0 1 25 0A5 5 0 0 1 35 0A5 5 0 0 1 45 0H60'),
  bat: () => P('M0 0H27M33 0H60M27 -12V12') + P('M33 -6V6', 'ln thick'),
  trafo: () => P('M0 0H14M46 0H60') + Ci(24, 0, 10) + Ci(36, 0, 10),
  earth: () => P('M0 0H24M24 -12V12M29 -8V8M34 -4V4'),
  pe: () => P('M0 0H24M24 -9V9M29 -6V6M34 -3V3') + Ci(29, 0, 14),
  amm: () => P('M0 0H18M42 0H60') + Ci(30, 0, 12, 'ln bgf') + Tx(30, 5, 'A'),
  volt: () => P('M0 0H18M42 0H60') + Ci(30, 0, 12, 'ln bgf') + Tx(30, 5, 'V'),
  motor: () => P('M0 0H12') + Ci(31, 0, 19, 'ln bgf') + Tx(31, 1, 'M', 'tx big') + Tx(31, 13, '3~', 'tx sm'),
};
/* ---- Drabinka PLC (IEC 61131-3 LD) ---- */
const LS = {
  no: () => P('M0 0H23M37 0H60M23 -12V12M37 -12V12'),
  nc: () => LS.no() + P('M25.5 10L34.5 -10'),
  p: () => LS.no() + Tx(30, 4.5, 'P', 'tx sm'),
  n: () => LS.no() + Tx(30, 4.5, 'N', 'tx sm'),
  coil: () => P('M0 0H19.6M40.4 0H60M25 -12A16 16 0 0 0 25 12M35 -12A16 16 0 0 1 35 12'),
  ncoil: () => LS.coil() + P('M26.5 9L33.5 -9'),
  set: () => LS.coil() + Tx(30, 4.5, 'S', 'tx sm'),
  reset: () => LS.coil() + Tx(30, 4.5, 'R', 'tx sm'),
};
function FB(x, y, w, title, ins, outs, o = {}) {
  const gap = o.gap || 22, rows = Math.max(ins.length, outs.length);
  const h = 30 + (rows - 1) * gap + 22;
  let s = Re(x, y, w, h, o.q ? 'qb' : 'ln bgf', 3);
  s += o.q ? `<text class="qt" x="${x + w / 2}" y="${y + 22}" text-anchor="middle">?</text>` : Tx(x + w / 2, y + 17, title, 'tx');
  ins.forEach((p, i) => { const py = y + 30 + i * gap; s += P(`M${x - 10} ${py}H${x}`) + Tx(x + 5, py + 4, p, 'tx sm', 'start'); });
  outs.forEach((p, i) => { const py = y + 30 + i * gap; s += P(`M${x + w} ${py}H${x + w + 10}`) + Tx(x + w - 5, py + 4, p, 'tx sm', 'end'); });
  return s;
}

/* ---- Pneumatyka / hydraulika ISO 1219 (współrzędne bezwzględne) ---- */
function spring(x, y, dir = 1, adj = false) {
  const pts = [[3, -6], [7, 6], [11, -6], [15, 6], [18, 0]];
  let d = `M${x} ${y}`; pts.forEach(([dx, dy]) => d += `L${x + dir * dx} ${y + dy}`);
  return P(d) + (adj ? Ar(x + dir * 1, y + 10, x + dir * 19, y - 10, 5) : '');
}
const exh = (x, y) => P(`M${x} ${y}V${y + 5}`) + P(`M${x - 4} ${y + 5}H${x + 4}L${x} ${y + 11}Z`, 'ln bgf');
const FL = {
  pump: (x, y, hyd = true) => Ci(x, y, 14, 'ln bgf') + P(`M${x} ${y - 14}L${x - 6} ${y - 5}L${x + 6} ${y - 5}Z`, hyd ? 'lnf' : 'ln bgf'),
  hmotor: (x, y) => Ci(x, y, 14, 'ln bgf') + P(`M${x} ${y - 3}L${x - 5.5} ${y - 12}L${x + 5.5} ${y - 12}Z`, 'lnf'),
  emotor: (x, y) => Ci(x, y, 14, 'ln bgf') + Tx(x, y + 5, 'M'),
  shaft: (x1, x2, y) => P(`M${x1} ${y - 2.5}H${x2}M${x1} ${y + 2.5}H${x2}`),
  tank: (x, y) => P(`M${x - 14} ${y}V${y + 12}H${x + 14}V${y}`),
  gauge: (x, y) => Ci(x, y, 10, 'ln bgf') + Ar(x - 6, y + 6, x + 6.5, y - 6.5, 5),
  filter: (x, y) => P(`M${x} ${y - 12}L${x + 12} ${y}L${x} ${y + 12}L${x - 12} ${y}Z`, 'ln bgf') + P(`M${x - 12} ${y}H${x + 12}`, 'ln dash'),
  check: (x, y, up = true) => { const s = up ? 1 : -1; return P(`M${x - 9} ${y - 2 * s}L${x} ${y + 8 * s}L${x + 9} ${y - 2 * s}`) + Ci(x, y, 5.5, 'ln bgf'); },
  relief: (x, y) => Re(x - 14, y - 14, 28, 28, 'ln bgf') + Ar(x - 8, y - 10, x - 8, y + 10, 5) + P(`M${x} ${y - 22}H${x - 26}V${y}H${x - 14}`, 'ln dash') + spring(x + 14, y, 1, true),
  reducing: (x, y) => Re(x - 14, y - 14, 28, 28, 'ln bgf') + Ar(x, y - 10, x, y + 10, 5) + P(`M${x} ${y + 22}H${x - 26}V${y}H${x - 14}`, 'ln dash') + spring(x + 14, y, 1, true),
  throttle: (x, y, adj = true) => P(`M${x} ${y - 14}V${y + 14}`) + P(`M${x - 7} ${y - 12}Q${x - 1} ${y} ${x - 7} ${y + 12}M${x + 7} ${y - 12}Q${x + 1} ${y} ${x + 7} ${y + 12}`) + (adj ? Ar(x - 12, y + 11, x + 12, y - 11, 5) : ''),
  oneway: (x, y, freeUp = true) => {
    const cx = x + 24;
    let s = FL.throttle(x, y) + P(`M${x} ${y - 24}V${y - 14}M${x} ${y + 14}V${y + 24}`);
    s += P(`M${x} ${y - 19}H${cx}M${x} ${y + 19}H${cx}`) + dot(x, y - 19) + dot(x, y + 19);
    s += freeUp ? P(`M${cx} ${y + 19}V${y + 8}M${cx} ${y - 5.5}V${y - 19}`) : P(`M${cx} ${y - 19}V${y - 8}M${cx} ${y + 5.5}V${y + 19}`);
    return s + FL.check(cx, y, freeUp);
  },
  cylDA: (x, y, w = 120) => Re(x, y, w, 24, 'ln bgf') + Re(x + 28, y + 9.5, w - 28 + 34, 5, 'ln bgf') + P(`M${x + 28} ${y}V${y + 24}`, 'ln thick'),

function valve(x, y, squares, left = [], right = []) {
  let s = '';

    const ox = x + i * VS; s += Re(ox, y, VS, VS, 'ln bgf');
    els.forEach(e => {
      if (e[0] === 'a') {
        const [x1, y1] = vpos(e[1]), [x2, y2] = vpos(e[2]);
        s += Ar(ox + x1, y + (y1 ? VS - 4 : 4), ox + x2, y + (y2 ? VS - 4 : 4), 5);

        const [px, py] = vpos(e[1]); const yb = y + py + (py ? -10 : 10);

  let lx = x; left.forEach(a => { const r = actuator(a, lx, y + VS / 2, -1); s += r.s; lx = r.x; });
  let rx = x + squares.length * VS; right.forEach(a => { const r = actuator(a, rx, y + VS / 2, 1); s += r.s; rx = r.x; });

}

function compUnit(x, y, lx) { return FL.pump(x, y, false) + FL.shaft(x + 14, x + 36, y) + FL.emotor(x + 50, y) + Tx(lx ?? x + 72, y + 4, 'sprężone powietrze', 'tx sm mu', 'start'); }
function pnSA() {
  let s = W([[68, 64], [68, 96], [90, 96], [90, 122]]) + W([[90, 178], [90, 230]]);
  s += FL.cylSA(60, 40, 150) + QB(90, 150, 110, 56) + compUnit(90, 244);

function pnDA() {
  let s = W([[68, 64], [68, 110], [115, 110], [115, 132]]) + W([[202, 64], [202, 110], [155, 110], [155, 132]]) + W([[135, 188], [135, 240]]);

function pnOr() {

/* ===== Aplikacja ===== */
const DAY = 86400000;
const INT = [0, 1, 3, 7, 16, 35]; // dni dla pudełek Leitnera 0–5
const $ = (s, r = document) => r.querySelector(s);
const view = $('#view');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ymd = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

/* ---- karty ---- */
const CARDS = [];
Object.entries(DECKS).forEach(([dk, d]) => d.cards.forEach(([en, pl, ex]) => CARDS.push({ id: dk + ':' + en, deck: dk, en, pl, ex })));

/* ---- zapis ---- */
const KEY = 'technauka.v1';
const DEFAULTS = () => ({ cards: {}, q: {}, sym: {}, streak: { last: null, n: 0 }, prefs: { deck: 'all', dir: 'en', symCat: 'E', symMode: 'quiz', schCat: 'all' }, updatedAt: 0 });
function normalize(d) { const b = DEFAULTS(); if (!d || typeof d !== 'object') return b; return { ...b, ...d, prefs: { ...b.prefs, ...(d.prefs || {}) }, streak: { ...b.streak, ...(d.streak || {}) }, cards: d.cards || {}, q: d.q || {}, sym: d.sym || {} }; }
const Store = {
  s: DEFAULTS(),
  load() { let d = null; try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { } this.s = normalize(d); },
  write() { try { localStorage.setItem(KEY, JSON.stringify(this.s)); } catch (e) { } },
  save() { this.s.updatedAt = Date.now(); this.write(); Sync.schedule(); },
};
/* Synchronizacja z kontem Claude (tylko w opublikowanym artefakcie) */
const Sync = {
  ref: null, timer: null, busy: false, again: false, on: false,
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      const ref = db.doc('data/users/' + uid + '/progress');
      const snap = await ref.get();
      this.ref = ref; this.on = true;
      let remote = null;
      if (snap.exists) { try { remote = normalize(JSON.parse(snap.data().state)); } catch (e) { remote = null; } }
      if (remote && (remote.updatedAt || 0) > (Store.s.updatedAt || 0)) { Store.s = remote; Store.write(); route(); }
      else if ((Store.s.updatedAt || 0) > ((remote && remote.updatedAt) || 0)) this.schedule(200);
      paintSync();
    } catch (e) { this.ref = null; this.on = false; }
  },
  schedule(ms = 2500) { if (!this.ref) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms); },
  async flush(retry = true) {
    if (!this.ref) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try { await this.ref.set({ state: JSON.stringify(Store.s), updatedAt: Store.s.updatedAt }); }
    catch (e) {
      const c = e && e.code;
      if (c === 'unavailable' && retry) setTimeout(() => this.flush(false), 2000 + Math.random() * 2000);
      else if (c && c !== 'resource_exhausted' && c !== 'unavailable') { this.ref = null; this.on = false; paintSync(); }
    }
    this.busy = false;
    if (this.again) { this.again = false; this.flush(); }
  },
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && Sync.ref) { clearTimeout(Sync.timer); Sync.flush(); } });
function paintSync() { const el = $('#syncinfo'); if (el) el.innerHTML = syncText(); }
const syncText = () => Sync.on ? '<span class="sync-dot on"></span>Postęp zapisuje się na Twoim koncie Claude (telefon i komputer).' : '<span class="sync-dot"></span>Postęp zapisuje się w tej przeglądarce.';

function bumpStreak() {
  const st = Store.s.streak, today = ymd(Date.now()), yest = ymd(Date.now() - DAY);
  if (st.last === today) return;
  st.n = st.last === yest ? st.n + 1 : 1; st.last = today; paintStreak();
}
function streakNow() { const st = Store.s.streak; const today = ymd(Date.now()), yest = ymd(Date.now() - DAY); return (st.last === today || st.last === yest) ? st.n : 0; }
function paintStreak() { const n = streakNow(); $('#streak').innerHTML = `Seria <b>${n}</b> ${n === 1 ? 'dzień' : 'dni'}`; }
function rec(kind, id, ok) {
  const m = Store.s[kind]; const r = m[id] || (m[id] = { n: 0, c: 0, last: 0 });
  r.n++; if (ok) r.c++; r.last = ok ? 1 : 0; bumpStreak(); Store.save();
}

const canSpeak = 'speechSynthesis' in window;
function speak(text) {
  try {
    if (!canSpeak) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g, ''));
    u.lang = 'en-GB'; u.rate = 0.92;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { }
}

/* ===== Fiszki: logika Leitnera ===== */
const cardState = id => Store.s.cards[id];
const deckCards = dk => dk === 'all' ? CARDS : CARDS.filter(c => c.deck === dk);
function deckStats(dk) {
  const now = Date.now(); let due = 0, fresh = 0, mastered = 0;
  deckCards(dk).forEach(c => { const st = cardState(c.id); if (!st) fresh++; else { if (st.due <= now) due++; if (st.b >= 4) mastered++; } });
  return { due, fresh, mastered, total: deckCards(dk).length };
}
let cs = null; // sesja fiszek
function startCards(extra = false) {
  const dk = Store.s.prefs.deck, now = Date.now(); const pool = deckCards(dk);
  let ids;
  if (!extra) {
    const due = pool.filter(c => cardState(c.id) && cardState(c.id).due <= now).sort((a, b) => cardState(a.id).due - cardState(b.id).due).map(c => c.id);
    const fresh = shuffle(pool.filter(c => !cardState(c.id)).map(c => c.id)).slice(0, 10);
    ids = due.slice(0, 20).concat(fresh);
  } else {
    ids = pool.slice().sort((a, b) => ((cardState(a.id) || { b: -1 }).b - (cardState(b.id) || { b: -1 }).b) || (Math.random() - .5)).slice(0, 10).map(c => c.id);
  }
  cs = { queue: shuffle(ids), i: 0, flipped: false, total: ids.length, res: { again: 0, hard: 0, good: 0 } };
  renderCards();
}
function gradeCard(g) {
  const id = cs.queue[cs.i]; const now = Date.now();
  const st = Store.s.cards[id] || { b: 0, due: now };
  if (g === 'again') { st.b = 0; st.due = now; const pos = Math.min(cs.queue.length, cs.i + 4); cs.queue.splice(pos, 0, id); }
  else if (g === 'hard') { st.b = Math.max(1, st.b - 1); st.due = now + DAY; }
  else { st.b = Math.min(5, st.b + 1); st.due = now + INT[st.b] * DAY; }
  Store.s.cards[id] = st; cs.res[g]++; bumpStreak(); Store.save();
  cs.i++; cs.flipped = false; renderCards();
}
let showList = false, listQuery = '';
function renderCards() {

      <p class="muted">Karty oznaczone „wiem” wrócą za 1, 3, 7, 16 i 35 dni. Trudniejsze – jutro.</p>

    <div class="chips" role="group" aria-label="Talia">${chip('all', 'Wszystkie')}${Object.entries(DECKS).map(([k, d]) => chip(k, d.name)).join('')}</div>

    <div class="kpis"><div class="kpi"><b>${st.due}</b><span>do powtórki</span></div><div class="kpi"><b>${st.fresh}</b><span>nowe</span></div><div class="kpi"><b>${st.mastered}</b><span>opanowane z ${st.total}</span></div></div>
    ${n ? `<button class="btn pri wide" data-act="cards-start">Zacznij: ${n} ${n === 1 ? 'karta' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'karty' : 'kart'}</button>`
      : `<div class="panel"><b>Na dziś wszystko powtórzone.</b> <span class="muted">Możesz zrobić dodatkową rundę z najsłabszymi kartami.</span></div><button class="btn pri wide" data-act="cards-extra">Dodatkowa runda (10)</button>`}
    <button class="linkbtn" data-act="toggle-list">${showList ? 'Ukryj listę słówek' : 'Pokaż listę słówek'}</button>`;
  if (showList) {
    html += `<label class="eyebrow" for="q-search">Szukaj</label><input id="q-search" class="search" type="search" placeholder="np. bearing, wzorcowanie" value="${esc(listQuery)}" autocomplete="off">

function wordList() {

function renderCardSession() {

/* ===== Silnik quizu (symbole, schematy, ciśnienie) ===== */
const quizzes = {};
function makeQuiz(kind, list) { return { kind, list: list.map(q => ({ q, order: shuffle(q.options.map((_, i) => i)) })), i: 0, score: 0, picked: null, wrong: [] }; }
function renderQuiz(z, title, back) {
  if (z.i >= z.list.length) return renderSummary(z, title, back);
  const { q, order } = z.list[z.i];
  const isSym = q.options.some(o => o.svg);
  const answered = z.picked !== null;
  const opts = order.map((oi, k) => {
    const o = q.options[oi]; let cls = 'opt' + (o.svg ? ' sym' : '') + (o.code ? ' code' : '');
    if (answered) { if (oi === q.answer) cls += ' right'; else if (oi === z.picked) cls += ' wrong'; else cls += ' dim'; }
    const inner = o.svg
      ? `${o.svg}${o.tag ? `<span class="tg">${esc(o.tag)}</span>` : ''}${answered && o.name ? `<span class="nm">${esc(o.name)}</span>` : ''}`
      : `<span class="k">${'ABCD'[k]}</span><span>${o.code ? esc(o.code) : esc(o.text)}</span>`;
    return `<button class="${cls}" data-act="pick" data-i="${oi}" ${answered ? 'disabled' : ''}>${inner}</button>`;
  }).join('');
  let fig = '';
  if (q.fig) fig = `<figure class="diagram">${q.fig()}</figure>`;
  else if (q.code) fig = `<pre class="code">${esc(q.code).replace('____', '<span class="blank">____</span>')}</pre>`;
  else if (q.big) fig = `<div class="symbig">${q.big}</div>`;
  const ok = answered && z.picked === q.answer;
  const right = q.options[q.answer];
  const rightName = right.name || right.text || right.code || '';
  view.innerHTML = `<div class="stack">
    <div class="qhead"><div class="progress"><span class="stat">${z.i + 1} / ${z.list.length}</span><div class="meter"><i style="width:${pct(z.i, z.list.length)}%"></i></div><button class="linkbtn" data-act="quiz-quit">Zakończ</button></div>
    <span class="eyebrow">${esc(title)}${q.title ? ' · ' + esc(q.title) : ''}</span></div>
    <p class="qprompt">${q.prompt}</p>
    ${fig}
    <div class="opts${isSym ? ' grid' : ''}">${opts}</div>
    ${answered ? `<div class="explain ${ok ? 'ok' : 'bad'}" id="explain"><div class="verdict">${ok ? 'Dobrze!' : 'Nie tym razem'}</div>${!ok ? `<p><b>Poprawnie:</b> ${esc(rightName)}</p>` : ''}${q.en ? `<p class="en-term">EN: ${esc(q.en)}</p>` : ''}<p>${q.explain || ''}</p><button class="btn pri wide" data-act="next">${z.i + 1 < z.list.length ? 'Dalej' : 'Wynik'}</button></div>` : ''}
  </div>`;
  if (answered) { const ex = $('#explain'); if (ex && ex.scrollIntoView) ex.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
}
function renderSummary(z, title, back) {
  const n = z.list.length;
  view.innerHTML = `<div class="stack">
    <span class="eyebrow">${esc(title)} · wynik</span>
    <div class="row" style="align-items:baseline"><span class="score">${z.score}/${n}</span><span class="muted">${pct(z.score, n)}% poprawnie</span></div>
    ${z.wrong.length ? `<div class="panel"><h3>Do powtórki</h3><ul class="wronglist">${z.wrong.map(q => `<li>${esc(q.title || q.pl || '')}</li>`).join('')}</ul></div>` : '<div class="panel"><b>Bez błędów.</b></div>'}
    ${z.wrong.length ? `<button class="btn pri wide" data-act="quiz-wrong">Powtórz błędne (${z.wrong.length})</button>` : ''}
    <button class="btn wide" data-act="quiz-again">Nowa runda</button>
    <button class="btn ghost wide" data-act="quiz-back">${esc(back)}</button></div>`;

function pick(z, oi) {
  if (z.picked !== null) return;
  const { q } = z.list[z.i]; z.picked = oi; const ok = oi === q.answer;
  if (ok) z.score++; else { z.wrong.push(q); try { navigator.vibrate && navigator.vibrate(60); } catch (e) { } }
  rec(z.kind === 'sym' ? 'sym' : 'q', q.id, ok);
}

/* ===== Symbole ===== */
function symPool() { const c = Store.s.prefs.symCat; return c === 'all' ? SYMBOLS : SYMBOLS.filter(s => s.cat === c); }
const symMastered = s => { const r = Store.s.sym[s.id]; return r && r.last === 1 && r.c >= 2; };
function symQuestion(s) {
  const same = SYMBOLS.filter(x => x.cat === s.cat && x.id !== s.id);
  const others = shuffle(same.slice()).slice(0, 3);
  const all = [s, ...others];
  return { id: s.id, title: '', pl: s.pl, en: s.en, prompt: 'Co oznacza ten symbol?', big: s.svg(), options: all.map(x => ({ text: x.pl })), answer: 0, explain: s.note };
}
function startSym(list) {
  let base = list;
  if (!base) {
    const pool = symPool();
    base = shuffle(pool.map(s => { const r = Store.s.sym[s.id]; const w = !r ? 2 : 1 + (r.last ? 0 : 2) + (r.c < 2 ? 1 : 0); return { s, k: Math.random() * w }; })).sort((a, b) => b.k - a.k).slice(0, 10).map(x => x.s);
  }
  quizzes.sym = makeQuiz('sym', base.map(symQuestion));
  renderSymbols();
}
function renderSymbols() {
  const p = Store.s.prefs;
  if (quizzes.sym) return renderQuiz(quizzes.sym, 'Symbole', 'Wróć do symboli');
  const pool = symPool(); const m = pool.filter(symMastered).length;
  const chip = (k, name) => `<button class="chip" data-act="symcat" data-k="${k}" aria-pressed="${p.symCat === k}">${name}</button>`;
  let html = `<div class="stack">
    <div><span class="eyebrow">IEC 60617 · ISO 1219 · IEC 61131-3</span><h1>Symbole</h1><p class="lede">Elektryczne, pneumatyczne i hydrauliczne oraz elementy drabinki PLC.</p></div>
    <div class="chips" role="group" aria-label="Kategoria">${Object.entries(SYM_CATS).map(([k, v]) => chip(k, v)).join('')}${chip('all', 'Wszystkie')}</div>

    <div class="meter"><i style="width:${pct(m, pool.length)}%"></i></div>`;

  } else {
    html += `<div class="atlas">${pool.map(s => `<div class="acard">${s.svg()}<h3>${esc(s.pl)}${symMastered(s) ? '<span class="ok-dot" title="Opanowany"></span>' : ''}</h3><span class="en">${esc(s.en)}</span>${s.note ? `<p>${esc(s.note)}</p>` : ''}</div>`).join('')}</div>`;
  }

/* ===== Schematy i ciśnienie ===== */
function schPool() { const c = Store.s.prefs.schCat; return c === 'all' ? SCHEMATICS : SCHEMATICS.filter(q => q.cat === c); }
const doneCount = list => list.filter(q => (Store.s.q[q.id] || {}).last === 1).length;
function renderSchem() {
  if (quizzes.sch) return renderQuiz(quizzes.sch, 'Uzupełnij schemat', 'Wróć do schematów');
  const p = Store.s.prefs; const pool = schPool(); const d = doneCount(pool);
  const chip = (k, name) => { const l = k === 'all' ? SCHEMATICS : SCHEMATICS.filter(q => q.cat === k); return `<button class="chip" data-act="schcat" data-k="${k}" aria-pressed="${p.schCat === k}">${name}<span class="n">${doneCount(l)}/${l.length}</span></button>`; };
  const wrongIds = pool.filter(q => (Store.s.q[q.id] || {}).n && !(Store.s.q[q.id] || {}).last);
  view.innerHTML = `<div class="stack">
    <div><span class="eyebrow">Drabinka · sterowanie stycznikowe · pneumatyka · hydraulika</span><h1>Uzupełnij schemat</h1><p class="lede">Na schemacie brakuje elementu w miejscu „?”. Wybierz, co tam pasuje – po odpowiedzi zobaczysz wyjaśnienie.</p></div>
    <div class="chips" role="group" aria-label="Kategoria">${chip('all', 'Wszystkie')}${Object.entries(SCH_CATS).map(([k, v]) => chip(k, v)).join('')}</div>
    <div class="meter"><i style="width:${pct(d, pool.length)}%"></i></div>
    <button class="btn pri wide" data-act="sch-start">Start: ${pool.length} zadań</button>
    ${wrongIds.length ? `<button class="btn wide" data-act="sch-wrong">Tylko błędne (${wrongIds.length})</button>` : ''}
    <div class="panel"><h3>Zadania w tej kategorii</h3><ul class="wronglist">${pool.map(q => `<li>${esc(SCH_CATS[q.cat])}: ${esc(q.title)}${(Store.s.q[q.id] || {}).last === 1 ? ' ✓' : ''}</li>`).join('')}</ul></div>
  </div>`;
}
function renderPressure() {
  if (quizzes.pr) return renderQuiz(quizzes.pr, 'Ciśnienie', 'Wróć');
  const d = doneCount(PRESSURE);
  const wrongIds = PRESSURE.filter(q => (Store.s.q[q.id] || {}).n && !(Store.s.q[q.id] || {}).last);
  view.innerHTML = `<div class="stack">
    <div><span class="eyebrow">F = p · A · 1 bar = 10 N/cm² ≈ 14,5 psi</span><h1>Ciśnienie</h1><p class="lede">Co zmienić w układzie, żeby obniżyć ciśnienie? Zawory przelewowe i redukcyjne, pułapki z dławikami, obliczenia siły i jednostek, klasa manometru.</p></div>
    <div class="row"><span class="stat">Poprawne: ${d} / ${PRESSURE.length}</span></div>
    <div class="meter"><i style="width:${pct(d, PRESSURE.length)}%"></i></div>
    <button class="btn pri wide" data-act="pr-start">Start: ${PRESSURE.length} zadań</button>
    ${wrongIds.length ? `<button class="btn wide" data-act="pr-wrong">Tylko błędne (${wrongIds.length})</button>` : ''}
    <div class="panel stack"><h3>Ściąga</h3>
      <p class="small" style="margin:0"><b>Przelewowy</b> – normalnie zamknięty, ogranicza maksymalne ciśnienie całego układu, sterowany z wejścia.<br><b>Redukcyjny</b> – normalnie otwarty, daje niższe, stałe ciśnienie w jednej gałęzi, sterowany z wyjścia.<br><b>Dławik</b> – zmienia prędkość (przepływ), nie obniża ciśnienia statycznego.<br><b>Siła</b> – F = p · A, A = π · d² / 4.</p></div>
  </div>`;
}

/* ===== Start ===== */
function renderHome() {
  const cst = deckStats('all');
  const symM = SYMBOLS.filter(symMastered).length, schD = doneCount(SCHEMATICS), prD = doneCount(PRESSURE);
  const todo = cst.due + Math.min(cst.fresh, 10);
  view.innerHTML = `<div class="stack">
    <div><span class="eyebrow">PLC · elektryka · hydraulika · angielski</span><h1>Nauka na dziś</h1></div>
    <div class="panel today"><div><div class="eyebrow">Fiszki do zrobienia</div><div class="big">${todo}</div><div class="muted small">${cst.due} do powtórki, ${Math.min(cst.fresh, 10)} nowych</div></div>
      <a class="btn pri" href="#fiszki" data-act="go-cards">Powtórz</a></div>
    <div class="tiles">
      <a class="tile" href="#fiszki"><span class="ico">${IC.cards}</span><h3>Fiszki EN</h3><p>Offshore, metrologia, PLC – z wymową.</p><span class="stat">${cst.mastered} / ${cst.total} opanowane</span><div class="meter"><i style="width:${pct(cst.mastered, cst.total)}%"></i></div></a>
      <a class="tile" href="#symbole"><span class="ico">${IC.sym}</span><h3>Symbole</h3><p>Elektryczne, ISO 1219, drabinka PLC.</p><span class="stat">${symM} / ${SYMBOLS.length} opanowane</span><div class="meter"><i style="width:${pct(symM, SYMBOLS.length)}%"></i></div></a>
      <a class="tile" href="#schematy"><span class="ico">${IC.sch}</span><h3>Uzupełnij schemat</h3><p>Brakujący styk, zawór albo blok.</p><span class="stat">${schD} / ${SCHEMATICS.length} poprawnie</span><div class="meter"><i style="width:${pct(schD, SCHEMATICS.length)}%"></i></div></a>
      <a class="tile" href="#cisnienie"><span class="ico">${IC.gauge}</span><h3>Ciśnienie</h3><p>Co zmienić, żeby je obniżyć.</p><span class="stat">${prD} / ${PRESSURE.length} poprawnie</span><div class="meter"><i style="width:${pct(prD, PRESSURE.length)}%"></i></div></a>
    </div>
    <div class="foot"><span id="syncinfo">${syncText()}</span>
      <div id="resetbox"><button class="linkbtn" data-act="reset-ask">Wyczyść cały postęp</button></div></div>
  </div>`;
}

/* ===== Routing i zdarzenia ===== */
const ROUTES = { '': renderHome, fiszki: renderCards, symbole: renderSymbols, schematy: renderSchem, cisnienie: renderPressure };
let current = '';
function route() {
  const h = location.hash.replace('#', ''); current = ROUTES[h] ? h : '';
  ROUTES[current]();
  document.querySelectorAll('.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.r === current ? 'page' : 'false'));
  paintStreak();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

const ACTIONS = {
  deck: el => { Store.s.prefs.deck = el.dataset.k; Store.write(); renderCards(); },
  dir: el => { Store.s.prefs.dir = el.dataset.k; Store.write(); renderCards(); },
  'cards-start': () => { startCards(false); window.scrollTo(0, 0); },
  'cards-extra': () => { startCards(true); window.scrollTo(0, 0); },
  'cards-quit': () => { cs = null; renderCards(); },
  'cards-home': () => { cs = null; renderCards(); },
  'toggle-list': () => { showList = !showList; renderCards(); },
  flip: () => { if (cs && !cs.flipped) { cs.flipped = true; renderCardSession(); } },
  say: el => speak(el.dataset.t),
  grade: el => gradeCard(el.dataset.g),
  symcat: el => { Store.s.prefs.symCat = el.dataset.k; Store.write(); renderSymbols(); },
  symmode: el => { Store.s.prefs.symMode = el.dataset.k; Store.write(); renderSymbols(); },
  'sym-start': () => { startSym(); window.scrollTo(0, 0); },
  schcat: el => { Store.s.prefs.schCat = el.dataset.k; Store.write(); renderSchem(); },
  'sch-start': () => { quizzes.sch = makeQuiz('q', shuffle(schPool().slice())); renderSchem(); window.scrollTo(0, 0); },
  'sch-wrong': () => { quizzes.sch = makeQuiz('q', shuffle(schPool().filter(q => (Store.s.q[q.id] || {}).n && !(Store.s.q[q.id] || {}).last))); renderSchem(); window.scrollTo(0, 0); },
  'pr-start': () => { quizzes.pr = makeQuiz('q', shuffle(PRESSURE.slice())); renderPressure(); window.scrollTo(0, 0); },
  'pr-wrong': () => { quizzes.pr = makeQuiz('q', shuffle(PRESSURE.filter(q => (Store.s.q[q.id] || {}).n && !(Store.s.q[q.id] || {}).last))); renderPressure(); window.scrollTo(0, 0); },
  pick: el => { const z = activeQuiz(); if (!z) return; pick(z, +el.dataset.i); rerenderQuiz(); },
  next: () => { const z = activeQuiz(); if (!z) return; z.i++; z.picked = null; rerenderQuiz(); window.scrollTo(0, 0); },
  'quiz-quit': () => { const k = quizKey(); if (k) delete quizzes[k]; ROUTES[current](); },
  'quiz-back': () => { const k = quizKey(); if (k) delete quizzes[k]; ROUTES[current](); },
  'quiz-again': () => {
    const k = quizKey(); if (!k) return;
    if (k === 'sym') { delete quizzes.sym; startSym(); }
    else if (k === 'sch') { quizzes.sch = makeQuiz('q', shuffle(schPool().slice())); renderSchem(); }
    else { quizzes.pr = makeQuiz('q', shuffle(PRESSURE.slice())); renderPressure(); }
    window.scrollTo(0, 0);
  },
  'quiz-wrong': () => {
    const k = quizKey(); if (!k) return; const w = quizzes[k].wrong.slice();
    if (k === 'sym') { startSym(SYMBOLS.filter(s => w.some(q => q.id === s.id))); }
    else { quizzes[k] = makeQuiz('q', shuffle(w)); ROUTES[current](); }
    window.scrollTo(0, 0);
  },
  'go-cards': () => { },
  'reset-ask': () => { $('#resetbox').innerHTML = `<div class="confirm"><span>Usunąć postęp fiszek, quizów i serię?</span><button class="btn danger" data-act="reset-do">Tak, wyczyść</button><button class="btn ghost" data-act="reset-no">Anuluj</button></div>`; },
  'reset-no': () => { $('#resetbox').innerHTML = '<button class="linkbtn" data-act="reset-ask">Wyczyść cały postęp</button>'; },
  'reset-do': () => { const prefs = Store.s.prefs; Store.s = DEFAULTS(); Store.s.prefs = prefs; Store.save(); cs = null; Object.keys(quizzes).forEach(k => delete quizzes[k]); renderHome(); paintStreak(); },
};
const quizKey = () => current === 'symbole' ? 'sym' : current === 'schematy' ? 'sch' : current === 'cisnienie' ? 'pr' : null;
const activeQuiz = () => { const k = quizKey(); return k ? quizzes[k] : null; };
function rerenderQuiz() { ROUTES[current](); }
view.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !view.contains(el)) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'flip' && e.target.closest('.say')) return;
  fn(el);
});
view.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.flash')) { e.preventDefault(); ACTIONS.flip(); }
});
document.addEventListener('keydown', e => {
  if (current === 'fiszki' && cs && cs.flipped && !e.target.matches('input')) { if (e.key === '1') gradeCard('again'); if (e.key === '2') gradeCard('hard'); if (e.key === '3') gradeCard('good'); }
});

Store.load();
route();
Sync.init();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.claude) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
}

</script>
</body>
</html>
